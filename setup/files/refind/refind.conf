# Written by ~/.config/setup (refind module); edit it in the dotfiles repo.
# Every option is documented in /usr/share/refind/refind/refind.conf-sample.
timeout 20
use_nvram false
resolution max
use_graphics_for linux,grub,osx,windows

# Hide duplicates: PikaOS's /boot volume (the UKIs in EFI/Linux are the
# entries to use) and the extra loaders on the Windows EFI partition
dont_scan_volumes PikaOS
dont_scan_dirs +,WIN11-EFI:/EFI/Boot,WIN11-EFI:/EFI/ubuntu

# Theme: rEFInd-lite (files in themes/rEFInd-lite). Its background is stored
# pre-scaled to 2560x1440 (the DP monitor's native mode). rEFInd's own scaler
# ("banner_scale fillscreen") draws colored streaks over its fine grid, so the
# image is shown unscaled: exact at 1440p, centered and cropped below that.
include themes/rEFInd-lite/theme.conf
banner_scale noscale

# rEFInd 0.14.2 bug: "showtools" overwrites the first slots of its 12-slot
# default list instead of clearing it, so the theme's 3-tool line showed the
# defaults' about/shutdown/reboot/firmware again after it. Fill all 12 slots;
# apple_recovery never shows on a PC, so it pads the rest out invisibly.
# https://sourceforge.net/p/refind/discussion/general/thread/ed3185fb40/
showtools shutdown,reboot,firmware,apple_recovery,apple_recovery,apple_recovery,apple_recovery,apple_recovery,apple_recovery,apple_recovery,apple_recovery,apple_recovery
