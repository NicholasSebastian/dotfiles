"Boot with logging" "nowatchdog nvidia-drm.modeset=1 rootflags=rw,relatime nvidia-drm.fbdev=1 rd.modules_force_load=nvidia,usbhid root=UUID=@ROOT_UUID@ ---"
"Boot with safe graphics" "amd_pstate=active nowatchdog amd_prefcore=enable rootflags=rw,relatime nvidia-drm.fbdev=1 rd.modules_force_load=nvidia,usbhid root=UUID=@ROOT_UUID@ nomodeset ---"
